<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}
body{width:1200px;height:800px;background:#0B2A2B;font-family:-apple-system,"Helvetica Neue",sans-serif;color:#F4F1E8;position:relative;overflow:hidden}
.glow{position:absolute;right:-200px;top:-200px;width:800px;height:800px;border-radius:50%;background:#123B3C}
.left{position:absolute;left:72px;top:110px;width:470px}
.logo{display:flex;align-items:center;gap:16px;font-size:72px;font-weight:800;letter-spacing:-1px}
.dot{width:22px;height:64px;border-radius:11px;background:#F2B544}
h2{margin-top:34px;font-size:40px;line-height:1.2;font-weight:700}
h2 span{color:#F2B544}
p{margin-top:26px;font-size:25px;line-height:1.45;color:#A9C4C1}
.chips{margin-top:40px;display:flex;gap:12px;flex-wrap:wrap}
.chip{border:2px solid #18494A;border-radius:30px;padding:10px 20px;font-size:21px;font-weight:600;color:#F4F1E8;background:#123B3C}
.tv{position:absolute;left:580px;top:150px;width:580px;border:14px solid #1C1C1C;border-radius:14px;box-shadow:0 30px 60px rgba(0,0,0,.5)}
.tv img{display:block;width:100%}
.stand{position:absolute;left:820px;top:493px;width:100px;height:40px;background:#1C1C1C;border-radius:0 0 8px 8px}
.phone{position:absolute;left:1005px;top:380px;width:150px;height:290px;background:#1C1C1C;border-radius:26px;padding:10px;box-shadow:0 20px 40px rgba(0,0,0,.6)}
.screen{background:#F4F1E8;border-radius:18px;height:100%;color:#0B2A2B;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.screen .n{font-size:68px;font-weight:800;line-height:1}
.screen .l{font-size:17px;font-weight:700;color:#18494A}
.screen .b{margin-top:14px;width:100px;height:10px;border-radius:5px;background:#d9d4c4;overflow:hidden}
.screen .b i{display:block;width:60%;height:100%;background:#7ED492}
.tag{position:absolute;left:600px;top:600px;font-size:22px;color:#A9C4C1;width:380px;line-height:1.4}
.tag b{color:#F2B544}
</style></head><body>
<div class="glow"></div>
<div class="left">
 <div class="logo"><div class="dot"></div>SteadyUp</div>
 <h2>Strength &amp; balance on your TV.<br><span>Your phone counts the reps.</span></h2>
 <p>No wearable. No app to install. Just put the phone in your pocket.</p>
 <div class="chips"><div class="chip">Fire TV</div><div class="chip">Vega OS</div><div class="chip">Amazon Bedrock</div></div>
</div>
<div class="tv"><img src="sit-to-stand.png"></div>
<div class="stand"></div>
<div class="phone"><div class="screen"><div class="l">REPS</div><div class="n">3/5</div><div class="l">Sit to stand</div><div class="b"><i></i></div></div></div>
<div class="tag"><b>Phone in pocket</b> → reps counted<br>and balance scored live</div>
</body></html>
