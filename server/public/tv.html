<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SteadyUp TV preview</title>
  <style>
    :root { --bg: #0f3d3e; --panel: #15504f; --fg: #f4f1e8; --accent: #f2b544; --muted: #a9c4c1; --ok: #7ed492; --bad: #ff8a7a; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--fg);
           font: 22px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 32px; }
    h1 { margin: 0 0 4px; font-size: 40px; }
    .sub { color: var(--muted); margin: 0 0 24px; font-size: 18px; }
    .grid { display: grid; grid-template-columns: minmax(260px, 340px) 1fr; gap: 24px; }
    @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } body { padding: 16px; } }
    .panel { background: var(--panel); border-radius: 20px; padding: 24px; }
    #qr svg { width: 100%; height: auto; background: #fff; border-radius: 12px; }
    .code { font-size: 48px; font-weight: 800; letter-spacing: 8px; text-align: center; margin: 12px 0 0; }
    #peer { margin-top: 12px; text-align: center; font-size: 18px; }
    #peer.ok { color: var(--ok); } #peer.bad { color: var(--bad); }
    .controls { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 24px; }
    button { font: inherit; font-size: 20px; font-weight: 700; border: 3px solid transparent; border-radius: 14px;
             padding: 14px 22px; background: rgba(255,255,255,.1); color: var(--fg); cursor: pointer; }
    button:focus-visible, button:hover { border-color: var(--accent); outline: none; }
    button.primary { background: var(--accent); color: #1c1c1c; }
    .readout { display: flex; gap: 40px; align-items: flex-end; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
    .big { font-size: 120px; font-weight: 800; line-height: 1; }
    .label { color: var(--muted); font-size: 18px; }
    .meter { height: 36px; border-radius: 18px; background: rgba(255,255,255,.12); overflow: hidden; margin: 20px 0 6px; }
    .meter > div { height: 100%; width: 0; background: linear-gradient(90deg, var(--bad), var(--accent), var(--ok)); transition: width .12s linear; }
    #alert { display: none; margin-top: 20px; padding: 18px; border-radius: 14px; background: var(--bad); color: #1c1c1c; font-weight: 700; }
    #alert.on { display: block; }
    #log { margin-top: 20px; font-size: 16px; color: var(--muted); max-height: 180px; overflow: auto; }
  </style>
</head>
<body>
  <h1>SteadyUp</h1>
  <p class="sub">TV preview in the browser. The Fire TV app uses the same connection.</p>
  <div class="grid">
    <div class="panel">
      <div id="qr">Creating session…</div>
      <div class="code" id="code">····</div>
      <div id="peer" class="bad">Scan with your phone</div>
    </div>
    <div class="panel">
      <div class="controls">
        <button id="calibrate">1 · Sit down, then calibrate</button>
        <button id="reps" class="primary">2 · Sit-to-stand</button>
        <button id="hold">3 · Balance hold (10 s)</button>
        <button id="stop">Stop</button>
      </div>
      <div class="readout">
        <div><div class="big" id="repCount">0</div><div class="label">sit-to-stands</div></div>
        <div><div class="big" id="steady">–</div><div class="label">steadiness</div></div>
        <div><div class="big" id="angle">0°</div><div class="label">thigh angle</div></div>
      </div>
      <div class="meter"><div id="meter"></div></div>
      <div class="label" id="mode">Mode: idle</div>
      <div id="alert">Possible fall detected. Are you OK? Press any button to dismiss.</div>
      <div id="log"></div>
    </div>
  </div>
  <script type="module" src="/tv.js"></script>
</body>
</html>
