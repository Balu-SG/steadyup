<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f3d3e">
  <title>SteadyUp phone</title>
  <style>
    :root { --bg: #0f3d3e; --fg: #f4f1e8; --accent: #f2b544; --muted: #a9c4c1; --ok: #7ed492; --bad: #ff8a7a; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--fg);
           font: 20px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
           display: flex; flex-direction: column; align-items: center; justify-content: center;
           padding: 24px 16px; text-align: center; gap: 20px; }
    h1 { margin: 0; font-size: 32px; letter-spacing: .5px; }
    p { margin: 0; max-width: 28ch; }
    .muted { color: var(--muted); font-size: 17px; }
    button { font: inherit; font-size: 26px; font-weight: 700; border: 0; border-radius: 999px;
             padding: 22px 48px; background: var(--accent); color: #1c1c1c; min-width: 240px; }
    button:disabled { opacity: .5; }
    #status { font-size: 18px; padding: 8px 16px; border-radius: 999px; background: rgba(255,255,255,.08); }
    #status.ok, #wake.ok { color: var(--ok); } #status.bad, #wake.bad { color: var(--bad); }
    #wake { font-size: 16px; max-width: 30ch; }
    #live { display: none; font-variant-numeric: tabular-nums; }
    #live.on { display: block; }
    .big { font-size: 64px; font-weight: 800; line-height: 1; }
  </style>
</head>
<body>
  <h1>SteadyUp</h1>
  <p id="intro">Your phone counts your movements and sends them to the TV.</p>
  <button id="start">Start</button>
  <p class="muted" id="hint">Then put the phone in your <strong>front trouser pocket</strong>, screen facing your leg.</p>
  <div id="live">
    <div class="big" id="reps">0</div>
    <div class="muted" id="detail">reps</div>
  </div>
  <div id="status">Not connected</div>
  <div id="wake" class="muted"></div>
  <script type="module" src="/phone.js"></script>
</body>
</html>
