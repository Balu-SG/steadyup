# Render blueprint: deploys the SteadyUp pairing/relay server with HTTPS.
# render.com -> New -> Blueprint -> pick this repo.
services:
  - type: web
    name: steadyup
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci
    startCommand: node src/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # AI coach on Amazon Bedrock (server/src/coach.js). Without credentials the
      # server uses rule-based coaching messages instead.
      - key: AWS_REGION
        value: us-east-1
      - key: BEDROCK_MODEL_ID
        value: us.amazon.nova-lite-v1:0
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
